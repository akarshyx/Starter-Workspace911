kind = "web"
previewPath = "/"
title = "Workspace Home"
description = "A lightweight workspace home page for organizing a person's active projects, quick links, and daily priorities, with a simple responsive interface ready to customize."
version = "1.0.0"
id = "artifacts/workspace-home"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20393

[services.development]
run = "pnpm --filter @workspace/workspace-home run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workspace-home", "run", "build" ]
serve = "static"
publicDir = "artifacts/workspace-home/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20393"
BASE_PATH = "/"
